<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=Special+Elite&display=swap">
  <style>
    :root{
      --paper: oklch(0.97 0.015 85);
      --paper-dark: oklch(0.93 0.02 80);
      --ink: oklch(0.27 0.03 55);
      --green-deep: oklch(0.30 0.06 152);
      --green: oklch(0.40 0.08 152);
      --green-light: oklch(0.55 0.09 152);
      --green-soft: oklch(0.90 0.03 145);
      --forest: oklch(0.40 0.07 148);
      --forest-dark: oklch(0.32 0.06 148);
      --brown: oklch(0.42 0.05 55);
      --brown-dark: oklch(0.28 0.04 50);
      --tan: oklch(0.80 0.06 75);
      --trail: oklch(0.82 0.05 75);
      --water: oklch(0.66 0.08 230);
      --water-dark: oklch(0.56 0.09 230);
      --red: oklch(0.52 0.16 25);
      --blue: oklch(0.45 0.09 250);
      --gold: oklch(0.74 0.11 80);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    a{color:var(--green-deep);} a:hover{color:var(--green-deep);}
    .screen{
      width:1280px; height:800px; position:relative;
      background:var(--paper);
      font-family:'Public Sans', system-ui, sans-serif;
      color:var(--ink);
      overflow:hidden;
    }
    .frame{
      position:absolute; inset:26px;
      border:10px solid var(--brown-dark);
      border-radius:14px;
      background: var(--paper-dark);
      box-shadow: inset 0 0 0 4px var(--tan), 0 18px 40px oklch(0.2 0.02 60 / 0.25);
    }
    .maze{
      position:absolute; left:170px; top:132px; width:940px; height:528px;
      display:grid;
      grid-template-columns:repeat(11,1fr);
      grid-template-rows:repeat(6,1fr);
      gap:3px; padding:10px;
      background:var(--brown-dark);
      border:6px double var(--brown-dark);
      border-radius:6px;
      box-shadow: inset 0 0 20px oklch(0.2 0.02 60 / 0.35), 0 10px 24px oklch(0.2 0.02 60 / 0.3);
    }
    .cell{ position:relative; border-radius:3px; display:flex; align-items:center; justify-content:center; }
    .cell-forest{ background:var(--forest); }
    .cell-forest .tree-ic{ width:60%; height:60%; color:var(--forest-dark); }
    .cell-trail{ background:var(--trail); }
    .cell-water{ background:var(--water); box-shadow: inset 0 0 8px var(--water-dark); }
    .cell-water .obj-ic{ width:70%; height:70%; color:var(--brown-dark); }
    .cell-poi{ background:var(--paper); outline:2px solid var(--brown); }
    .poi{ display:flex; flex-direction:column; align-items:center; gap:2px; }
    .poi-ic{ width:56%; height:56%; color:var(--brown-dark); }
    .poi-label{
      font-family:'Special Elite','Courier New',monospace;
      font-size:8.5px; letter-spacing:.03em; color:var(--brown-dark);
    }
    .player{
      position:absolute; left:225px; top:588px; width:40px; height:40px;
      border-radius:50%; background:var(--gold); border:3px solid var(--brown-dark);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 4px 8px oklch(0.2 0.02 60 / 0.4);
      z-index:5;
    }
    .player svg{ width:22px; height:22px; color:var(--brown-dark); }
    .hud-card{
      position:absolute; background:var(--paper);
      border:2px solid var(--brown); border-radius:8px;
      box-shadow: 0 8px 16px oklch(0.2 0.02 60 / 0.28);
      padding:12px 16px;
    }
    .hud-title{
      font-family:'Special Elite','Courier New',monospace;
      font-size:10px; letter-spacing:.08em; color:var(--brown); text-transform:uppercase;
      margin-bottom:4px;
    }
    .hud-obj{ top:44px; left:60px; width:300px; }
    .hud-obj-text{ font-family:'Public Sans'; font-weight:600; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px; }
    .hud-obj-text svg{ width:18px; height:18px; color:var(--green-deep); flex:none; }
    .hud-inv{ top:44px; right:60px; width:300px; display:flex; flex-direction:column; gap:8px; }
    .inv-row{ display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; }
    .inv-row svg{ width:20px; height:20px; color:var(--brown-dark); flex:none; }
    .inv-count{ margin-left:auto; font-family:'Special Elite','Courier New',monospace; color:var(--brown); }
    .hud-tally{
      bottom:56px; right:60px; width:220px;
      display:flex; align-items:center; gap:10px;
    }
    .hud-tally svg{ width:22px; height:22px; color:var(--gold); flex:none; }
    .hud-tally-text{ font-size:14px; font-weight:600; }
    .pause-btn{
      position:absolute; top:44px; right:376px;
      width:52px; height:52px; border-radius:50%;
      background:var(--brown-dark); color:var(--paper);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 6px 0 var(--brown), 0 10px 18px oklch(0.2 0.02 60 / 0.3);
    }
    .pause-btn svg{ width:20px; height:20px; }
    .prompt-chip{
      position:absolute; left:445px; top:565px;
      background:var(--ink); color:var(--paper);
      font-family:'Special Elite','Courier New',monospace;
      font-size:12px; padding:6px 12px; border-radius:14px;
      box-shadow: 0 6px 14px oklch(0.2 0.02 60 / 0.3);
    }
    .legend{
      position:absolute; left:60px; bottom:16px; right:60px;
      display:flex; gap:26px; align-items:center;
      font-size:11px; color:var(--brown-dark);
      border-top:1px dashed var(--tan); padding-top:10px;
    }
    .legend-item{ display:flex; align-items:center; gap:6px; }
    .legend-swatch{ width:16px; height:16px; border-radius:3px; border:1px solid var(--brown); }
  </style>
</helmet>
